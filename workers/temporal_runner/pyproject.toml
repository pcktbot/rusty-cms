[project]
name = "rusty-cms-temporal-runner"
version = "0.1.0"
description = "Temporal worker and workflow starter for rusty-cms"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0,<2",
  "temporalio>=1.18,<2",
]

[project.optional-dependencies]
anthropic = [
  "anthropic>=0.39,<1",
  "langsmith>=0.4,<1",
]
vertex = [
  "google-genai>=1,<2",
]
full = [
  "anthropic>=0.39,<1",
  "langsmith>=0.4,<1",
  "google-genai>=1,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
