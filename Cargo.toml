[workspace]
members = [
  "apps/cms-api",
  "apps/cms-worker",
  "crates/cms-core",
  "crates/cms-pubsub",
  "crates/cms-render",
  "crates/cms-workflows",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["http2", "json", "macros"] }
blake3 = "1.8.2"
schemars = { version = "1.1.0", features = ["derive", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.6", features = ["compression-full", "cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
